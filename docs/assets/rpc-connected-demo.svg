<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="RPC connected celebration animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="760" height="220" fill="#0A0E1A"/>
  <rect x="180" y="42" rx="18" ry="18" width="400" height="136" fill="url(#bg)" filter="url(#shadow)">
    <animate attributeName="opacity" values="0;1;1" dur="2.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 22;0 0;0 0" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="380" y="95" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">
    ✅ RPC Connected
    <animate attributeName="opacity" values="0;1;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <text x="380" y="132" text-anchor="middle" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600">
    🎉 Badge Claimed
    <animate attributeName="opacity" values="0;1;1" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <text x="380" y="158" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="14">
    0x12ab...9f31
  </text>

  <circle cx="140" cy="45" r="5" fill="#F59E0B">
    <animate attributeName="cy" values="45;25;45" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="185" r="6" fill="#A78BFA">
    <animate attributeName="cy" values="185;165;185" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="172" r="4" fill="#34D399">
    <animate attributeName="cy" values="172;152;172" dur="2.1s" repeatCount="indefinite"/>
  </circle>
</svg>
