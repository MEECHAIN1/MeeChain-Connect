# ═══════════════════════════════════════════════════════════════
# Cloudflare Tunnel Config — MeeChain
# Domains: app.meechain.xyz  →  http://127.0.0.1:3000
#           rpc.meechain.xyz  →  http://127.0.0.1:3000
# ═══════════════════════════════════════════════════════════════

tunnel: meechain-tunnel
credentials-file: /home/user/webapp/.cloudflared/tunnel-credentials.json

# ── Ingress Rules ──────────────────────────────────────────────
ingress:
  # App Dashboard  →  port 3000 (serves index.html + API)
  - hostname: app.meechain.xyz
    service: http://127.0.0.1:3000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # RPC Gateway  →  port 3000 (/rpc endpoint handles JSON-RPC)
  - hostname: rpc.meechain.xyz
    service: http://127.0.0.1:3000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Fallback — catch-all 404
  - service: http_status:404
