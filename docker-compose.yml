version: '3.9'
services:
  meechain-connect:
    image: node:22-bullseye
    working_dir: /app
    command: bash -lc "npm install --no-audit --no-fund && node server.js"
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      OPENAI_API_KEY: "local-dev-placeholder"
      RPC_MODE: "auto"
      RPC_ALLOW_MOCK_FALLBACK: "true"
    volumes:
      - ./:/app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/rpc/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
