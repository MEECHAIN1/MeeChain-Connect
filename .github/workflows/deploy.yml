name: 🚀 Deploy MeeChain to Cloudflare Pages (meebot.io)

on:
  push:
    branches:
      - main
      - genspark_ai_developer
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: 🌐 Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: meebot-io
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name == 'main' && 'main' || 'preview' }}
          wranglerVersion: '4'

      - name: 📝 Deployment Summary
        if: success()
        run: |
          echo "## 🎉 Deployed to meebot.io!" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Pages URL: https://meebot-io.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 Custom domain: https://meebot.io" >> $GITHUB_STEP_SUMMARY
          echo "- 📅 Deployed: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
