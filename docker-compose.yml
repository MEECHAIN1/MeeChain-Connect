# ============================================================
# MeeChain Dashboard — Compose File
# Works with:
#   docker compose up -d
#   podman-compose up -d
# ============================================================

version: "3.9"

services:
  meechain-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: meechainv02/meechainv2:latest
    container_name: meechain-dashboard

    # ── Ports ──────────────────────────────────────────────
    ports:
      - "${PORT:-3000}:3000"

    # ── Environment ─────────────────────────────────────────
    env_file:
      - .env
    environment:
      PORT: "3000"
      OPENAI_API_KEY: "local-dev-placeholder"
      RPC_MODE: "auto"
      RPC_ALLOW_MOCK_FALLBACK: "true"
      CHAIN_ID: ${CHAIN_ID:-13390}

    # ── Volumes ─────────────────────────────────────────────
    volumes:
      - ./:/app
      - meechain_logs:/app/logs

    # ── Restart Policy ──────────────────────────────────────
    restart: unless-stopped

    # ── Health Check ────────────────────────────────────────
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/rpc/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

    # ── Resource Limits (optional — comment out if not needed)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  meechain_logs:
